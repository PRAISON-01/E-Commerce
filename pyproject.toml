[project]
name = "e-commerce"
version = "0.1.0"
description = "E-Commerce API"
readme = "README.md"
authors = [
    { name = "Praise Nwankwo", email = "nwankwopraison@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi",
    "pydantic>=2.13.4",
    "sqlmodel",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "."